<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPasswrd — прототип</title>
<style>
/* ============ IPasswrd design tokens ============ */
:root{
  --bg: oklch(15.5% .01 255);
  --bg-deep: oklch(13% .01 255);
  --bg-list: oklch(17.5% .01 255);
  --surface: oklch(20.5% .012 255);
  --surface-2: oklch(24% .012 255);
  --line: oklch(100% 0 0 / .07);
  --line-strong: oklch(100% 0 0 / .13);
  --text: oklch(92.5% .004 255);
  --text-2: oklch(71% .008 255);
  --text-3: oklch(53% .01 255);
  --accent: oklch(80% .118 85);
  --accent-hi: oklch(85% .12 85);
  --on-accent: oklch(21% .05 85);
  --accent-wash: oklch(80% .118 85 / .1);
  --accent-wash-2: oklch(80% .118 85 / .17);
  --ok: oklch(74% .12 152);
  --ok-wash: oklch(74% .12 152 / .12);
  --warn: oklch(73% .14 55);
  --warn-wash: oklch(73% .14 55 / .12);
  --bad: oklch(64% .19 27);
  --bad-wash: oklch(64% .19 27 / .12);
  --info: oklch(72% .09 230);
  --shadow-1: 0 1px 2px oklch(0% 0 0/.25), 0 8px 28px oklch(0% 0 0/.35);
  --shadow-2: 0 2px 6px oklch(0% 0 0/.3), 0 16px 48px oklch(0% 0 0/.45);
  --hl: inset 0 1px 0 oklch(100% 0 0/.05);
  --ease: cubic-bezier(.32,.72,0,1);
  --r-s: 7px; --r-m: 10px; --r-l: 14px;
  --font: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono: "Cascadia Code","Cascadia Mono",Consolas,ui-monospace,monospace;
  color-scheme: dark;
}
html[data-theme="light"]{
  --bg: oklch(96.5% .006 90);
  --bg-deep: oklch(93% .009 90);
  --bg-list: oklch(98.2% .004 90);
  --surface: oklch(99.3% .002 90);
  --surface-2: oklch(95.5% .006 90);
  --line: oklch(0% 0 0 / .09);
  --line-strong: oklch(0% 0 0 / .16);
  --text: oklch(25% .012 260);
  --text-2: oklch(45% .012 260);
  --text-3: oklch(61% .01 260);
  --accent: oklch(57% .125 78);
  --accent-hi: oklch(51% .13 78);
  --on-accent: oklch(98.5% .008 85);
  --accent-wash: oklch(57% .125 78 / .1);
  --accent-wash-2: oklch(57% .125 78 / .18);
  --ok: oklch(56% .13 152);
  --ok-wash: oklch(56% .13 152 / .11);
  --warn: oklch(58% .14 55);
  --warn-wash: oklch(58% .14 55 / .12);
  --bad: oklch(53% .19 27);
  --bad-wash: oklch(53% .19 27 / .1);
  --info: oklch(52% .1 230);
  --shadow-1: 0 1px 2px oklch(20% .02 260/.08), 0 8px 28px oklch(20% .02 260/.1);
  --shadow-2: 0 2px 6px oklch(20% .02 260/.09), 0 16px 48px oklch(20% .02 260/.16);
  --hl: inset 0 1px 0 oklch(100% 0 0/.6);
  color-scheme: light;
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:var(--accent-wash-2)}
html,body{height:100%}
body{
  font-family:var(--font); font-size:13.5px; line-height:1.45; color:var(--text);
  background:var(--bg-deep); overflow:hidden;
  -webkit-font-smoothing:antialiased; transition:background .25s var(--ease), color .25s var(--ease);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block;flex:none}

/* ============ Window chrome ============ */
#window{height:100vh;display:grid;grid-template-rows:38px 1fr}
#titlebar{
  display:flex;align-items:center;gap:9px;padding:0 0 0 12px;
  background:var(--bg-deep);border-bottom:1px solid var(--line);user-select:none;position:relative;z-index:5;
}
#titlebar .brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.01em}
#titlebar .brand .glyph{color:var(--accent)}
#titlebar .proto-badge{
  font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);
  border:1px solid var(--line);border-radius:99px;padding:1.5px 8px;
}
#titlebar .drag{flex:1;height:100%}
#titlebar .tb-actions{display:flex;align-items:center;gap:2px;margin-right:6px}
.tb-btn{width:30px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--text-2);transition:background .15s var(--ease),color .15s var(--ease)}
.tb-btn:hover{background:var(--surface-2);color:var(--text)}
.win-controls{display:flex;height:38px}
.win-controls button{width:44px;display:grid;place-items:center;color:var(--text-2);transition:background .15s var(--ease)}
.win-controls button:hover{background:var(--surface-2)}
.win-controls .wc-close:hover{background:var(--bad);color:white}

/* ============ Screens ============ */
.screen{display:none;height:100%;min-height:0}
body[data-screen="onboarding"] #screen-onboarding{display:grid}
body[data-screen="lock"] #screen-lock{display:grid}
body[data-screen="app"] #screen-app{display:grid}
.screen-enter{animation:screenIn .28s var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ============ Onboarding & Lock ============ */
#screen-onboarding,#screen-lock{place-items:center;background:
  radial-gradient(600px 420px at 50% 18%, var(--accent-wash), transparent 70%), var(--bg-deep);}
.ob-shell{width:472px;max-width:92vw}
.ob-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow-2),var(--hl);padding:36px 40px 30px;
}
.ob-logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin:0 auto 18px;
  background:var(--accent-wash);border:1px solid var(--accent-wash-2);color:var(--accent)}
.ob-title{font-size:19px;font-weight:700;text-align:center;letter-spacing:-.01em}
.ob-sub{color:var(--text-2);text-align:center;margin-top:7px;font-size:13px;line-height:1.5}
.ob-body{margin-top:24px;display:grid;gap:12px}
.ob-foot{margin-top:26px;display:flex;align-items:center;justify-content:space-between}
.ob-dots{display:flex;gap:6px;justify-content:center;margin-top:20px}
.ob-dots i{width:6px;height:6px;border-radius:99px;background:var(--line-strong);transition:all .25s var(--ease)}
.ob-dots i.on{background:var(--accent);width:18px}
.ob-value{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg)}
.ob-value .ic{color:var(--accent);margin-top:1px}
.ob-value b{display:block;font-size:13px;font-weight:600}
.ob-value span{color:var(--text-2);font-size:12.5px}
.hello-ring{width:74px;height:74px;border-radius:50%;margin:6px auto 2px;display:grid;place-items:center;color:var(--accent);
  background:var(--accent-wash);border:1px solid var(--accent-wash-2);}
.icloud-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg)}
.icloud-row .st{margin-left:auto;font-size:12px;font-weight:600}
.st-ok{color:var(--ok)} .st-wait{color:var(--text-3)} .st-warn{color:var(--warn)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ Inputs ============ */
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--text-2)}
.input{position:relative;display:flex;align-items:center}
.input input,.input select{
  width:100%;background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r-s);
  padding:9px 12px;font-size:13.5px;outline:none;transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.input input::placeholder{color:var(--text-3)}
.input input:focus,.input select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.input .trail{position:absolute;right:6px;display:flex;gap:2px}
.input input.mono{font-family:var(--mono);letter-spacing:.02em}
.mini-strength{height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.mini-strength i{display:block;height:100%;border-radius:99px;background:var(--bad);transition:all .3s var(--ease)}

/* ============ Buttons ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--r-s);padding:9px 16px;font-size:13px;font-weight:600;
  transition:all .18s var(--ease);border:1px solid transparent;white-space:nowrap;
}
.btn:active{transform:scale(.975)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:var(--hl)}
.btn-primary:hover{background:var(--accent-hi)}
.btn-ghost{border-color:var(--line-strong);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--text-3)}
.btn-subtle{color:var(--text-2)}
.btn-subtle:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{color:var(--bad);border-color:transparent}
.btn-danger:hover{background:var(--bad-wash)}
.btn-block{width:100%}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px}
.icon-btn{width:29px;height:29px;display:grid;place-items:center;border-radius:6px;color:var(--text-2);transition:all .15s var(--ease)}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.accent{color:var(--accent)}
.icon-btn.copied{color:var(--ok)}

/* ============ App layout ============ */
#screen-app{grid-template-columns:228px 324px 1fr;background:var(--bg);min-height:0}
#screen-app.tool-mode{grid-template-columns:228px 1fr}
#screen-app.tool-mode #pane-list,#screen-app.tool-mode #pane-detail{display:none}
#screen-app:not(.tool-mode) #pane-tool{display:none}

/* --- Sidebar --- */
#sidebar{background:var(--bg-deep);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:10px 9px}
.side-group{margin-top:4px}
.side-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:10px 10px 5px}
.side-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:7.5px 10px;border-radius:var(--r-s);
  color:var(--text-2);font-size:13px;font-weight:500;transition:all .15s var(--ease);text-align:left;position:relative;
}
.side-item:hover{background:var(--surface);color:var(--text)}
.side-item.on{background:var(--accent-wash);color:var(--text)}
.side-item.on .si-ic{color:var(--accent)}
.side-item .si-ic{color:var(--text-3);transition:color .15s var(--ease)}
.side-item .cnt{margin-left:auto;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.side-item .dot-warn{position:absolute;right:10px;width:6px;height:6px;border-radius:99px;background:var(--warn)}
.side-spacer{flex:1}
.sync-chip{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-m);
  background:var(--bg);margin-bottom:8px;
}
.sync-chip .ic{color:var(--ok)}
.sync-chip .t{font-size:11.5px;line-height:1.3}
.sync-chip .t b{display:block;font-size:12px;font-weight:600}
.sync-chip .t span{color:var(--text-3)}
.side-foot{display:flex;gap:4px}
.side-foot .btn{flex:1}

/* --- List pane --- */
#pane-list{background:var(--bg-list);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{padding:12px 12px 8px;display:grid;gap:9px}
.list-title-row{display:flex;align-items:center;gap:8px;padding:0 2px}
.list-title-row h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.list-title-row .n{color:var(--text-3);font-size:12px;font-weight:500;margin-top:1px}
.search{position:relative}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);
  padding:7.5px 10px 7.5px 32px;font-size:13px;outline:none;transition:all .15s var(--ease);
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.search kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  font-family:var(--font);font-size:10.5px;color:var(--text-3);border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px;
}
#entry-list{flex:1;overflow-y:auto;padding:4px 8px 12px;min-height:0}
.row{
  width:100%;display:flex;align-items:center;gap:11px;padding:8.5px 9px;border-radius:var(--r-m);
  text-align:left;transition:background .13s var(--ease);animation:rowIn .3s var(--ease) both;
}
@keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.row:hover{background:var(--surface)}
.row.on{background:var(--accent-wash)}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rt span{display:block;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .flags{display:flex;gap:5px;align-items:center}
.row .flag{width:7px;height:7px;border-radius:99px}
.row .flag.bad{background:var(--bad)} .row .flag.warn{background:var(--warn)}
.row .fav{color:var(--accent)}
.mono-tile{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;
  font-size:14px;font-weight:700;color:var(--tile-fg);background:var(--tile-bg);border:1px solid var(--tile-line);
}
.empty{padding:44px 24px;text-align:center;color:var(--text-3);display:grid;gap:10px;justify-items:center}
.empty .ic{color:var(--text-3);opacity:.6}
.empty b{color:var(--text-2);font-weight:600;font-size:13px}
.empty span{font-size:12.5px;max-width:220px}

/* --- Detail pane --- */
#pane-detail{overflow-y:auto;min-height:0;background:var(--bg)}
.detail-wrap{max-width:640px;padding:28px 34px 44px;animation:screenIn .25s var(--ease)}
.detail-top{display:flex;align-items:center;gap:16px}
.detail-top .mono-tile{width:52px;height:52px;border-radius:13px;font-size:21px}
.detail-top .tt{flex:1;min-width:0}
.detail-top h1{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.detail-top .url{color:var(--text-3);font-size:12.5px;margin-top:2px;display:flex;align-items:center;gap:5px}
.detail-top .url a{color:var(--text-2);text-decoration:none}
.detail-top .url a:hover{color:var(--accent)}
.detail-actions{display:flex;gap:2px}
.src-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--text-2);background:var(--surface);
}
.src-badge .ic{color:var(--text-2)}
.src-badge.vault .ic{color:var(--accent)}
.detail-meta-row{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.warn-note{
  margin-top:16px;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--warn-wash);
  background:var(--warn-wash);border-radius:var(--r-m);padding:11px 13px;font-size:12.5px;color:var(--text);
}
.warn-note.bad{border-color:var(--bad-wash);background:var(--bad-wash)}
.warn-note .ic{color:var(--warn);margin-top:1px}
.warn-note.bad .ic{color:var(--bad)}
.warn-note a{color:var(--accent);font-weight:600;text-decoration:none;cursor:pointer}
.fgroup{margin-top:22px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--hl);overflow:hidden}
.frow{display:flex;align-items:center;gap:12px;padding:12px 15px;min-height:52px}
.frow + .frow{border-top:1px solid var(--line)}
.frow .fl{width:132px;flex:none;font-size:12.5px;color:var(--text-2)}
.frow .fv{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fv.mono{font-family:var(--mono);letter-spacing:.03em}
.frow .fv .dots{letter-spacing:.18em;color:var(--text-2)}
.frow .fa{display:flex;gap:2px}
.frow .fv a{color:var(--accent);text-decoration:none}
.strength-line{display:flex;align-items:center;gap:9px}
.strength-bar{width:88px;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.strength-bar i{display:block;height:100%;border-radius:99px}
.s-weak i{width:30%;background:var(--bad)} .s-mid i{width:60%;background:var(--warn)} .s-strong i{width:100%;background:var(--ok)}
.s-label{font-size:12px;font-weight:600}
.s-weak .s-label{color:var(--bad)} .s-mid .s-label{color:var(--warn)} .s-strong .s-label{color:var(--ok)}
.totp-wrap{display:flex;align-items:center;gap:11px}
.totp-code{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:.14em;color:var(--text)}
.totp-ring{width:22px;height:22px;border-radius:50%;position:relative;flex:none}
.totp-ring svg{position:absolute;inset:0}
.totp-ring .tr-bg{stroke:var(--line-strong)}
.totp-ring .tr-fg{stroke:var(--accent);transition:stroke-dashoffset 1s linear}
.detail-note{margin-top:22px}
.detail-note h3, .fgroup-title{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);margin:0 0 8px 2px}
.note-box{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:13px 15px;font-size:13px;color:var(--text-2);line-height:1.55;white-space:pre-line}
.detail-foot{margin-top:20px;display:flex;align-items:center;gap:14px;color:var(--text-3);font-size:12px;flex-wrap:wrap}
.detail-foot .sep{width:3px;height:3px;border-radius:99px;background:var(--text-3)}

/* --- Bank card visual --- */
.bank-card{
  margin-top:22px;width:392px;max-width:100%;aspect-ratio:1.586;border-radius:18px;position:relative;overflow:hidden;
  background:var(--card-bg);color:var(--card-fg);box-shadow:var(--shadow-1);padding:4px;
}
.bank-card .inner{
  position:absolute;inset:4px;border-radius:14px;border:1px solid oklch(100% 0 0/.14);
  padding:20px 22px;display:flex;flex-direction:column;
}
.bank-card .bank{font-size:13.5px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;justify-content:space-between}
.bank-card .paysys{font-size:12px;font-weight:600;opacity:.85}
.bank-card .num{font-family:var(--mono);font-size:18.5px;letter-spacing:.1em;margin-top:auto}
.bank-card .cc-meta{display:flex;gap:26px;margin-top:12px;font-size:11px}
.bank-card .cc-meta b{display:block;font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.06em;margin-top:2px}
.bank-card .cc-meta span{opacity:.65;text-transform:uppercase;letter-spacing:.08em;font-size:9.5px}
.bank-card .chip-g{position:absolute;top:52px;left:22px;width:38px;height:28px;border-radius:6px;
  background:oklch(80% .1 85/.9);opacity:.9;border:1px solid oklch(60% .1 85)}

/* --- Tool pane (generator / security / settings) --- */
#pane-tool{overflow-y:auto;min-height:0;background:var(--bg)}
.tool-wrap{max-width:660px;padding:30px 38px 48px;animation:screenIn .25s var(--ease)}
.tool-wrap>h1{font-size:20px;font-weight:700;letter-spacing:-.015em}
.tool-wrap>.tool-sub{color:var(--text-2);margin-top:5px;font-size:13px;max-width:52ch}
.gen-out{
  margin-top:24px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);
  box-shadow:var(--hl);padding:22px;display:grid;gap:16px;
}
.gen-pass{
  font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:.04em;line-height:1.4;word-break:break-all;min-height:56px;
  display:flex;align-items:center;
}
.gen-pass .d{color:var(--info)} .gen-pass .s{color:var(--accent)}
.gen-meta{display:flex;align-items:center;gap:12px}
.gen-meta .entropy{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;margin-left:auto}
.gen-actions{display:flex;gap:9px}
.gen-controls{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--hl);overflow:hidden}
.gc-row{display:flex;align-items:center;gap:14px;padding:13px 17px;min-height:52px}
.gc-row + .gc-row{border-top:1px solid var(--line)}
.gc-row .gl{flex:1;font-size:13px}
.gc-row .gl span{display:block;font-size:11.5px;color:var(--text-3);margin-top:1px}
.len-val{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--accent);width:34px;text-align:right;font-variant-numeric:tabular-nums}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:99px;background:var(--accent);
  border:none;box-shadow:0 1px 4px oklch(0% 0 0/.4);transition:transform .15s var(--ease);cursor:grab;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
.switch{position:relative;width:38px;height:22px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer}
.switch i{
  position:absolute;inset:0;border-radius:99px;background:var(--line-strong);transition:background .2s var(--ease);
}
.switch i::after{
  content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:var(--text-2);
  transition:transform .22s var(--ease), background .2s var(--ease);
}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(16px);background:var(--on-accent)}
.gen-history{margin-top:22px}
.gh-row{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.gh-row .p{font-family:var(--mono);font-size:12.5px;color:var(--text-2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-row .t{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* --- Security --- */
.sec-head{margin-top:24px;display:flex;gap:24px;align-items:center;border:1px solid var(--line);border-radius:var(--r-l);
  background:var(--surface);box-shadow:var(--hl);padding:22px}
.score-ring{width:96px;height:96px;position:relative;flex:none}
.score-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.score-ring .sr-bg{stroke:var(--line)}
.score-ring .sr-fg{stroke:var(--warn);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.score-ring .val{position:absolute;inset:0;display:grid;place-items:center;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
.sec-sum{flex:1;display:grid;gap:7px}
.sec-sum h2{font-size:15px;font-weight:700}
.sec-sum p{color:var(--text-2);font-size:12.5px;max-width:44ch}
.sec-counts{display:flex;gap:8px;margin-top:3px;flex-wrap:wrap}
.sec-chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;border-radius:99px;padding:4px 11px}
.sec-chip.bad{background:var(--bad-wash);color:var(--bad)}
.sec-chip.warn{background:var(--warn-wash);color:var(--warn)}
.sec-chip.mid{background:var(--surface-2);color:var(--text-2)}
.sec-group{margin-top:24px}
.sec-row{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);transition:background .13s var(--ease);text-align:left}
.sec-row:hover{background:var(--surface)}
.sec-row .rt{flex:1;min-width:0}
.sec-row .rt b{display:block;font-size:13px;font-weight:600}
.sec-row .rt span{font-size:12px;color:var(--text-3)}
.sec-row .go{color:var(--text-3)}
.sec-pill{font-size:11px;font-weight:700;border-radius:6px;padding:2.5px 8px;flex:none}
.sec-pill.bad{background:var(--bad-wash);color:var(--bad)}
.sec-pill.warn{background:var(--warn-wash);color:var(--warn)}

/* --- Settings --- */
.set-group{margin-top:22px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--hl);overflow:hidden}
.set-row{display:flex;align-items:center;gap:14px;padding:13px 17px;min-height:56px}
.set-row + .set-row{border-top:1px solid var(--line)}
.set-row .sl{flex:1}
.set-row .sl b{display:block;font-size:13.5px;font-weight:600}
.set-row .sl span{display:block;font-size:12px;color:var(--text-3);margin-top:1px;max-width:46ch}
.seg{display:flex;background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:2.5px;gap:2px}
.seg button{padding:5px 13px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--text-2);transition:all .18s var(--ease)}
.seg button.on{background:var(--surface-2);color:var(--text);box-shadow:var(--hl)}
.seg button:not(.on):hover{color:var(--text)}
.select-plain{background:var(--bg);border:1px solid var(--line-strong);border-radius:7px;padding:6px 10px;font-size:12.5px;outline:none}
.set-icloud{display:flex;align-items:center;gap:10px}
.set-icloud .st{font-size:12.5px;font-weight:600;color:var(--ok);display:flex;align-items:center;gap:6px}

/* --- Plus menu --- */
.list-title-row{position:relative}
.menu{
  position:absolute;top:34px;right:0;min-width:216px;z-index:30;

  box-shadow:var(--shadow-2);padding:5px;display:grid;gap:1px;
  animation:menuIn .16s var(--ease);transform-origin:top right;
}

.menu .m-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);padding:7px 10px 4px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text);transition:background .12s var(--ease);text-align:left}
.menu button:hover{background:var(--surface)}
.menu button .mi{color:var(--text-2)}

#editor{position:absolute;inset:0;z-index:20;background:var(--bg);display:none;overflow-y:auto}

.ed-bar{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;
  padding:12px 22px;background:var(--bg);border-bottom:1px solid var(--line);
}
.ed-bar .ed-title{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.ed-bar .ed-type{color:var(--text-3);font-weight:500}
.ed-bar .grow{flex:1}
.ed-body{max-width:560px;margin:0 auto;padding:34px 24px 60px;display:grid;gap:22px}
.ed-seg-row{display:grid;gap:8px}
.ed-fields{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--hl);padding:20px;display:grid;gap:15px}
/* --- Authenticator --- */
.auth-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px;margin-top:24px}
.auth-card{
  border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--hl);
  padding:15px 16px 14px;display:grid;gap:13px;cursor:pointer;text-align:left;
  transition:transform .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease);

.auth-card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.auth-card:active{transform:scale(.985)}
.auth-top{display:flex;gap:10px;align-items:center;min-width:0}
.auth-top .at{flex:1;min-width:0}
.auth-top .at b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-top .at span{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-code-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.auth-code{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.auth-hint{font-size:11px;color:var(--text-3)}
.tool-head-row{display:flex;align-items:flex-end;gap:14px}
.tool-head-row .grow{flex:1}
/* --- Passkey --- */
.pk-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--ok-wash);color:var(--ok)}
.ok-note{margin-top:16px;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ok-wash);background:var(--ok-wash);border-radius:var(--r-m);padding:11px 13px;font-size:12.5px}
.ok-note .ic{color:var(--ok);margin-top:1px}
.pk-hero{margin-top:20px;display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);box-shadow:var(--hl);padding:17px 18px}
.pk-hero .ring{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-wash);border:1px solid var(--accent-wash-2);color:var(--accent);flex:none}
.pk-hero .tx{flex:1}
.pk-hero .tx b{display:block;font-size:13.5px;font-weight:600}
.pk-hero .tx span{font-size:12px;color:var(--text-2)}
/* ============ Toast ============ */
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:50}
.toast{
  display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line-strong);
  border-radius:var(--r-m);box-shadow:var(--shadow-2);padding:10px 14px;font-size:13px;font-weight:500;
  animation:toastIn .3s var(--ease);
}
.toast.out{animation:toastOut .25s var(--ease) forwards}
.toast .ic{color:var(--ok)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px) scale(.98)}}

/* Per-title hue for monogram tiles */
const hue = str => { let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))%360; return h; };
const tileStyle = (title) => {
  const h = hue(title), light = document.documentElement.dataset.theme==='light';
  const fg = light? `oklch(48% .12 ${h})` : `oklch(80% .11 ${h})`;
  return `--tile-bg:oklch(${light?'60%':'70%'} .1 ${h} / .13);--tile-fg:${fg};--tile-line:oklch(70% .1 ${h} / .22)`;
};

function copyText(v, msgKey){
  const done = ()=> toast(STR[S.lang].copiedWhat[msgKey]||t('copied'));
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(v).then(done,()=>{fallbackCopy(v);done();});
  else {fallbackCopy(v);done();}
}
function fallbackCopy(v){const ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();}
let toastN=0;
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.innerHTML=`<span class="ic">${I('check',15)}</span>${esc(msg)}`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),260)},2200);
}

  if(!btn) return; const old=btn.innerHTML; btn.classList.add('copied'); btn.innerHTML=I('check',15);

}

/* ============ List ============ */
function plural(n){
  if(S.lang==='en') return n===1? t('entry_1') : t('entries');
  const m10=n%10, m100=n%100;
  if(m10===1&&m100!==11) return t('entry_1');
  if(m10>=2&&m10<=4&&(m100<10||m100>=20)) return t('entry_2');
  return t('entries');
}
function renderList(){
  const items = sectionItems(S.section);
  $('#list-head').innerHTML = `
    <div class="list-title-row"><h2>${t(S.section)}</h2><span class="n">${items.length} ${plural(items.length)}</span>
      <span style="flex:1"></span>
      <button class="icon-btn accent plus-btn" title="${t('newEntry')}" onclick="A.plusMenu(event)">${I('plus',18)}</button></div>
    <div class="search"><span class="ic">${I('search',15)}</span>
      <input id="q" placeholder="${t('search')}" value="${esc(S.q)}" oninput="A.search(this.value)"><kbd>Ctrl F</kbd></div>`;
  const listEl = $('#entry-list');
  if(!items.length){
    listEl.innerHTML = `<div class="empty"><span class="ic">${I('search',26)}</span><b>${t('emptyT')}</b><span>${t('emptyS')}</span></div>`;
    return;
  }
  /* Group login entries of the same site into one row (except while searching) */
  const rows=[]; const seenUrl=new Set();
  for(const e of items){
    if(!S.q && e.type==='login'){
      const grp = items.filter(x=>x.type==='login' && x.url===e.url);
      if(grp.length>1){
        if(seenUrl.has(e.url)) continue;
        seenUrl.add(e.url); rows.push({group:grp}); continue;
      }
    }
    rows.push({e});
  }
  listEl.innerHTML = rows.map((r,i)=>{
    const d = `style="animation-delay:${Math.min(i*18,160)}ms"`;
    if(r.group){
      const g=r.group, on=g.some(x=>x.id===S.sel);
      return `<button class="row ${on?'on':''}" ${d.replace('style="','style="')} onclick="A.selGroup('${esc(g[0].url)}')">
        <span class="mono-tile" style="${tileStyle(g[0].title)}">${mono1(g[0].title)}</span>
        <span class="rt"><b>${esc(g[0].title)}</b><span>${g.length} ${accWord(g.length)}</span></span>
        <span class="flags">
          ${g.some(x=>x.fav)?`<span class="fav">${I('star',13)}</span>`:''}
          ${g.some(x=>(x.issues||[]).includes('leak'))?'<span class="flag bad"></span>':''}
          ${g.some(x=>(x.issues||[]).some(y=>y==='weak'||y==='reused'))?'<span class="flag warn"></span>':''}
        </span>
      </button>`;
    }
    const e=r.e;
    return `<button class="row ${S.sel===e.id?'on':''}" ${d} onclick="A.sel(${e.id})">
      <span class="mono-tile" style="${tileStyle(e.title)}">${mono1(e.title)}</span>
      <span class="rt"><b>${esc(e.title)}</b><span>${esc(subOf(e)||'')}</span></span>
      <span class="flags">
        ${e.fav?`<span class="fav">${I('star',13)}</span>`:''}
        ${(e.issues||[]).includes('leak')?'<span class="flag bad"></span>':''}
        ${(e.issues||[]).some(x=>x==='weak'||x==='reused')?'<span class="flag warn"></span>':''}
      </span>
    </button>`;
  }).join('');
}
const paysysOf = d => {
  if(!d) return '';
  if(/^220[0-4]/.test(d)) return 'Мир';
  if(/^4/.test(d)) return 'Visa';
  if(/^5[1-5]/.test(d)) return 'Mastercard';
  if(/^3[47]/.test(d)) return 'Amex';
  if(/^2/.test(d) && d.length>=4) return 'Mastercard';
  return '';
};
const accWord = n => {
  if(S.lang==='en') return n===1?'account':'accounts';
  const m10=n%10, m100=n%100;
  if(m10===1&&m100!==11) return 'аккаунт';
  if(m10>=2&&m10<=4&&(m100<10||m100>=20)) return 'аккаунта';
  return 'аккаунтов';
};

    <div class="field"><label>${t('issued')}</label><div class="input"><input id="f-issued" value="${esc(f.issued||'')}"></div></div>`;
  if(f.type==='note') fields = `
    <div class="field"><label>${t('notesF')}</label><div class="input"><input id="f-body" value="${esc(f.body||'')}"></div></div>`;
  const srcHint = f.type==='login'
    ? `<span class="src-badge">${I('apple',12)} ${t('savedCloud')}</span>`
    : `<span class="src-badge vault">${I('lock',11)} ${t('srcVault')}</span>`;
  ed.innerHTML = `
  <div class="ed-bar">
    <button class="btn btn-subtle btn-sm" onclick="A.cancelForm()">${I('chevR',14).replace('M9 5l7 7-7 7','M15 5l-7 7 7 7')} ${t('back')}</button>
    <span class="ed-title">${f.id? t('editT') : t('newT')} <span class="ed-type">· ${typeName(f.type)}</span></span>
  </div>
  <div class="ed-body" onkeydown="if(event.key==='Enter'&&event.target.tagName==='INPUT')A.save()">
    ${typeSeg}
    <div class="ed-fields">
      <div class="field"><label>${t('fTitle')}</label><div class="input"><input id="f-title" value="${esc(f.title||'')}" placeholder="${t('fTitle')}"></div></div>
      ${fields}
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px">${srcHint}<span style="flex:1"></span>
        <button class="btn btn-primary" onclick="A.save()">${t('save')}</button></div>
    </div>
  </div>`;
  const ft = document.getElementById('f-title'); if(ft) ft.focus();
}

/* ============ Tools ============ */
function renderTool(){
  const p = $('#pane-tool');
  if(S.section==='authenticator') p.innerHTML = renderAuthenticator();
  else if(S.section==='generator') p.innerHTML = renderGenerator();
  else if(S.section==='security') p.innerHTML = renderSecurity();
  else if(S.section==='settings') p.innerHTML = renderSettings();
}

/* ============ Authenticator ============ */
function totpRing(px, id){
  const off = 56.5*(1-S.totpLeft/30);
  return `<span class="totp-ring" style="width:${px}px;height:${px}px"><svg viewBox="0 0 22 22">
    <circle class="tr-bg" cx="11" cy="11" r="9" fill="none" stroke-width="2.5"/>
    <circle class="tr-fg" cx="11" cy="11" r="9" fill="none" stroke-width="2.5" stroke-dasharray="56.5" stroke-dashoffset="${off}" transform="rotate(-90 11 11)"/></svg></span>`;
}
function renderAuthenticator(){
  const items = DB.filter(e=>e.totp);
  return `<div class="tool-wrap" style="max-width:760px">
    <div class="tool-head-row"><div class="grow"><h1>${t('authTitle')}</h1><div class="tool-sub">${t('authSub')}</div></div>
      <button class="btn btn-ghost" onclick="A.toast('${t('authAddToast')}')">${I('plus',15)} ${t('authAdd')}</button></div>
    <div class="auth-grid">
      ${items.map(e=>`<button class="auth-card" title="${t('tapToCopy')}" onclick="A.copyCode(this,${e.id})">
        <span class="auth-top"><span class="mono-tile" style="${tileStyle(e.title)};width:30px;height:30px;font-size:12.5px;border-radius:8px">${mono1(e.title)}</span>
          <span class="at"><b>${esc(e.title)}</b><span>${esc(e.user)}</span></span>
          <span class="src-badge" style="padding:2px 8px">${I('apple',11)}</span></span>
        <span class="auth-code-row"><span class="auth-code" data-code-of="${e.id}">${S.codes[e.id]||''}</span>${totpRing(26,e.id)}</span>
      </button>`).join('')}
    </div>
    <div class="auth-hint" style="margin-top:16px">${t('tapToCopy')}</div>
  </div>`;
}

function genPool(){
  let pool='';
  const g=S.gen;
  if(g.low) pool+='abcdefghijkmnopqrstuvwxyz'+(g.sim?'':'l');
  if(g.up) pool+='ABCDEFGHJKLMNPQRSTUVWXYZ'+(g.sim?'':'IO');
  if(g.dig) pool+='23456789'+(g.sim?'':'10');
  if(g.sym) pool+='!@#$%^&*?-_+=';
  return pool;
}
function genPassword(){
  const pool=genPool(); if(!pool){S.gen.out='';return;}
  let out=''; const a=new Uint32Array(S.gen.len); crypto.getRandomValues(a);
  for(let i=0;i<S.gen.len;i++) out+=pool[a[i]%pool.length];
  if(S.gen.out) S.gen.hist.unshift(S.gen.out), S.gen.hist=S.gen.hist.slice(0,5);
  S.gen.out=out;
}
const colorize = p => [...p].map(ch=>{
  if(/[0-9]/.test(ch)) return `<span class="d">${ch}</span>`;
  if(/[!@#$%^&*?\-_+=]/.test(ch)) return `<span class="s">${esc(ch)}</span>`;
  return esc(ch);
}).join('');
function renderGenerator(){
  const g=S.gen; if(!g.out) genPassword();
  const bits = Math.round(g.len*Math.log2(genPool().length||2));
  const rows = [
    ['up',t('upper'),t('upperS')],['low',t('lower'),t('lowerS')],
    ['dig',t('digits'),t('digitsS')],['sym',t('symbols'),t('symbolsS')],['sim',t('similar'),t('similarS')]
  ].map(([k,l,s])=>`<div class="gc-row"><div class="gl">${l}<span>${s}</span></div>
    <label class="switch"><input type="checkbox" ${g[k]?'checked':''} onchange="A.genOpt('${k}',this.checked)"><i></i></label></div>`).join('');
  return `<div class="tool-wrap">
    <h1>${t('genTitle')}</h1><div class="tool-sub">${t('genSub')}</div>
    <div class="gen-out">
      <div class="gen-pass" id="gen-pass">${colorize(g.out)}</div>
      <div class="gen-meta">
        <div class="gen-actions">
          <button class="btn btn-primary" onclick="A.copyGen(this)">${I('copy',15)} ${t('copyBtn')}</button>
          <button class="btn btn-ghost" onclick="A.regen()">${I('refresh',15)} ${t('genBtn')}</button>
        </div>
        <span class="entropy">≈ ${bits} ${t('entropy')}</span>
      </div>
    </div>
    <div class="gen-controls">
      <div class="gc-row"><div class="gl">${t('length')}</div>
        <input type="range" min="8" max="48" value="${g.len}" oninput="A.genLen(this.value)">
        <span class="len-val" id="len-val">${g.len}</span></div>
      ${rows}
    </div>
    ${g.hist.length? `<div class="gen-history"><div class="fgroup-title">${t('genHist')}</div>
      ${g.hist.map(h=>`<div class="gh-row"><span class="p">${esc(h)}</span>
        <button class="icon-btn" onclick="A.copy(this,'${esc(h).replace(/'/g,"\\'")}','pass')">${I('copy',14)}</button></div>`).join('')}</div>`:''}
  </div>`;
}

function renderSecurity(){
  const leak = DB.filter(e=>(e.issues||[]).includes('leak'));
  const weak = DB.filter(e=>(e.issues||[]).includes('weak')&&!(e.issues||[]).includes('leak'));
  const reused = DB.filter(e=>(e.issues||[]).includes('reused'));
  const okCnt = DB.filter(e=>e.type==='login'&&!(e.issues||[]).length).length;
  const score=72, C=276.5;
  const row = e=>`<button class="sec-row" onclick="A.openFromSec(${e.id})">
    <span class="mono-tile" style="${tileStyle(e.title)};width:30px;height:30px;font-size:12.5px;border-radius:8px">${mono1(e.title)}</span>
    <span class="rt"><b>${esc(e.title)}</b><span>${esc(e.user||'')}</span></span>
    <span class="btn btn-ghost btn-sm">${t('secFix')}</span></button>`;
  const group = (title,cls,list)=> list.length? `<div class="sec-group">
    <div class="fgroup-title">${title} <span class="sec-pill ${cls}" style="margin-left:6px">${list.length}</span></div>
    <div class="fgroup" style="padding:5px">${list.map(row).join('')}</div></div>`:'';
  return `<div class="tool-wrap">
    <h1>${t('secTitle')}</h1><div class="tool-sub">${t('secSub')}</div>
    <div class="sec-head">
      <div class="score-ring"><svg viewBox="0 0 96 96"><circle class="sr-bg" cx="48" cy="48" r="44" fill="none" stroke-width="7"/>
        <circle class="sr-fg" cx="48" cy="48" r="44" fill="none" stroke-width="7" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-score/100)}"/></svg>
        <span class="val">${score}</span></div>
      <div class="sec-sum"><h2>${t('secScoreT')}</h2><p>${t('secScoreP')}</p>
        <div class="sec-counts">
          <span class="sec-chip bad">${I('alert',13)} ${leak.length} ${t('leaks')}</span>
          <span class="sec-chip warn">${I('key',13)} ${weak.length} ${t('weaks')}</span>
          <span class="sec-chip mid">${I('copy',13)} ${reused.length} ${t('reused')}</span>
          <span class="sec-chip mid" style="color:var(--ok);background:var(--ok-wash)">${I('check',13)} ${okCnt} ${t('secOk')}</span>
          <span class="sec-chip mid" style="color:var(--ok);background:var(--ok-wash)">${I('passkey',13)} ${DB.filter(e=>e.type==='passkey'||e.passkey).length} ${t('secPk')}</span>
        </div></div>
    </div>
    ${group(t('grLeak'),'bad',leak)}
    ${group(t('grWeak'),'warn',weak)}
    ${group(t('grReused'),'warn',reused)}
  </div>`;
}

function renderSettings(){
  const segTheme = `<div class="seg"><button class="${S.theme==='dark'?'on':''}" onclick="A.theme('dark')">${t('themeD')}</button><button class="${S.theme==='light'?'on':''}" onclick="A.theme('light')">${t('themeL')}</button></div>`;
  const segLang = `<div class="seg"><button class="${S.lang==='ru'?'on':''}" onclick="A.lang('ru')">Русский</button><button class="${S.lang==='en'?'on':''}" onclick="A.lang('en')">English</button></div>`;
  const setRow = (b,s,ctrl)=>`<div class="set-row"><div class="sl"><b>${b}</b>${s?`<span>${s}</span>`:''}</div>${ctrl}</div>`;
  return `<div class="tool-wrap">
    <h1>${t('setTitle')}</h1><div class="tool-sub">${t('setSub')}</div>
    <div class="fgroup-title" style="margin-top:26px">${t('appearance')}</div>
    <div class="set-group" style="margin-top:8px">
      ${setRow(t('theme'),'',segTheme)}
      ${setRow(t('lang'),'',segLang)}
    </div>
    <div class="fgroup-title" style="margin-top:26px">${t('protection')}</div>
    <div class="set-group" style="margin-top:8px">
      ${setRow(t('helloT'),t('helloS'),`<label class="switch"><input type="checkbox" ${S.obHello?'checked':''} onchange="A.helloSet(this.checked)"><i></i></label>`)}
      ${setRow(t('autolock'),t('autolockS'),`<select class="select-plain" onchange="A.toast('${t('autolock')}: '+this.options[this.selectedIndex].text)">
        <option>${t('min1')}</option><option selected>${t('min5')}</option><option>${t('min15')}</option><option>${t('never')}</option></select>`)}
    </div>
    <div class="fgroup-title" style="margin-top:26px">${t('syncT')}</div>
    <div class="set-group" style="margin-top:8px">
      ${setRow(t('icloudT'),t('icloudS'),`<span class="set-icloud"><span class="st">${I('check',14)} ${t('connected')}</span>
        <button class="btn btn-ghost btn-sm">${t('disconnect')}</button></span>`)}
    </div>
    <div class="fgroup-title" style="margin-top:26px">${t('dataT')}</div>
    <div class="set-group" style="margin-top:8px">
      ${setRow(t('importT'),t('importS'),`<button class="btn btn-ghost btn-sm" onclick="A.toast('${t('importToast')}')">${I('importIc',14)} ${t('importBtn')}</button>`)}
      ${setRow(t('exportT'),t('exportS'),`<button class="btn btn-ghost btn-sm" onclick="A.toast('${t('exportToast')}')">${I('exportIc',14)} ${t('exportBtn')}</button>`)}
      ${setRow(t('aboutT'),t('aboutS'),`<span style="color:var(--text-3);font-size:12px">v0.1</span>`)}
    </div>
  </div>`;
}

/* ============ Render root ============ */
function renderApp(){
  const isTool = TOOL_IDS.includes(S.section);
  $('#screen-app').classList.toggle('tool-mode', isTool);
  renderSidebar();
  if(isTool) renderTool(); else { renderList(); renderDetail(); }
}
function renderAll(){
  renderChrome();
  if(S.screen==='onboarding') renderOnboarding();
  else if(S.screen==='lock') renderLock();
  else renderApp();
}

/* ============ Actions ============ */
window.A = {
  obGo(n){ S.obStep=n; renderOnboarding(); },
  obStrength(v){
    const p = Math.min(100, v.length*7 + (/[A-ZА-Я]/.test(v)?12:0) + (/\d/.test(v)?12:0) + (/[^\wа-яА-Я]/.test(v)?16:0));
    const el=$('#ob-str'); el.style.width=p+'%';
    el.style.background = p<40?'var(--bad)':p<70?'var(--warn)':'var(--ok)';
  },
  obHello(){ S.obHello=!S.obHello; renderOnboarding(); },
  obConnect(){ S.obCloud='checking'; renderOnboarding(); setTimeout(()=>{S.obCloud='ok'; renderOnboarding();}, 1100); },
  obFinish(){ S.obHello=true; S.obCloud='ok'; setScreen('app'); renderAll(); },
  lock(){ setScreen('lock'); renderLock(); },
  helloUnlock(){
    const b=$('#hello-btn'); if(b){ b.innerHTML=`<span class="spin" style="display:inline-flex">${I('sync',16)}</span> ${t('checking')}`; }
    setTimeout(()=>{ setScreen('app'); renderAll(); }, 700);
  },
  unlock(){ setScreen('app'); renderAll(); },
  go(sec){ S.section=sec; S.q=''; S.form=null;
    if(!TOOL_IDS.includes(sec)){ const first=sectionItems(sec)[0]; if(first && !sectionItems(sec).some(e=>e.id===S.sel)) S.sel=first.id; }
    renderApp(); },
  sel(id){ S.sel=id; S.form=null; renderList(); renderDetail(); },
  selGroup(url){
    const grp = DB.filter(x=>x.type==='login' && x.url===url);
    const cur = grp.find(x=>x.id===S.sel);
    S.sel = cur? cur.id : grp[0].id;
    renderList(); renderDetail();
  },
  cycleAcc(id,d){
    const e = DB.find(x=>x.id===id);
    const grp = DB.filter(x=>x.type==='login' && x.url===e.url);
    const i = grp.findIndex(x=>x.id===id);
    S.sel = grp[(i+d+grp.length)%grp.length].id;
    renderList(); renderDetail();
  },
  search(v){ S.q=v; renderListOnly(); },
  copy(btn,v,k){ copyText(v.replace(/\\n/g,'\n'),k); flashCopied(btn); },
  copyCode(el,id){ copyText((S.codes[id]||'').replace(' ',''),'code'); if(el.classList.contains('icon-btn')) flashCopied(el); },
  reveal(id){ S.reveal[id]=!S.reveal[id]; renderDetail(); },
  fav(id){ const e=DB.find(x=>x.id===id); e.fav=!e.fav; renderList(); renderDetail(); },
  del(btn,id){
    if(!S.confirmDel){ S.confirmDel=true; btn.outerHTML=`<button class="btn btn-danger btn-sm" onclick="A.del(this,${id})">${t('confirmDel')}</button>`; setTimeout(()=>S.confirmDel=false, 2600); return; }
    const i=DB.findIndex(x=>x.id===id); DB.splice(i,1); S.confirmDel=false; S.sel=null; toast(t('deleted')); renderApp();
  },
  edit(id){ const e=DB.find(x=>x.id===id); S.form={...e}; renderEditor(); },
  plusMenu(ev){
    ev.stopPropagation();
    const old=document.getElementById('plus-menu'); if(old){ old.remove(); return; }
    const row=ev.target.closest('.list-title-row');
    row.insertAdjacentHTML('beforeend', `<div class="menu" id="plus-menu">
      <div class="m-label">${t('menuAdd')}</div>
      ${TYPE_META.map(([ty,ic])=>`<button onclick="A.openAdd('${ty}')"><span class="mi">${I(ic,16)}</span>${typeName(ty)}</button>`).join('')}
    </div>`);
  },
  openAdd(ty){ const m=document.getElementById('plus-menu'); if(m) m.remove(); S.form={type:ty}; renderEditor(); },
  formType(ty){ Object.assign(S.form,{type:ty}); renderEditor(); },
  formGen(){ genPassword(); const el=document.getElementById('f-pass'); if(el) el.value=S.gen.out; },
  fmtCard(el){
    const d = el.value.replace(/\D/g,'').slice(0,19);
    el.value = d.replace(/(.{4})/g,'$1 ').trim();
    const ps = document.getElementById('f-paysys'); if(ps) ps.textContent = paysysOf(d);
  },
  fmtExp(el){
    let d = el.value.replace(/\D/g,'').slice(0,4);
    if(d.length>=1 && +d[0]>1) d = '0'+d;
    if(d.length>=2){ let mm=+d.slice(0,2); if(mm===0) mm=1; if(mm>12) mm=12; d = String(mm).padStart(2,'0')+d.slice(2,4); }
    el.value = d.length>2 ? d.slice(0,2)+'/'+d.slice(2) : d;
  },
  fmtCvc(el){ el.value = el.value.replace(/\D/g,'').slice(0,4); },
  save(){
    const f=S.form; const g=id=>document.getElementById(id)?.value||'';
    f.title=g('f-title')||t('newT');
    if(f.type==='login'){ Object.assign(f,{url:g('f-url'),user:g('f-user'),pass:g('f-pass'),strength:g('f-pass').length>=14?'strong':g('f-pass').length>=9?'mid':'weak',issues:[],src:'icloud',totp:false}); }
    if(f.type==='card'){ const nd=g('f-num').replace(/\D/g,''); Object.assign(f,{num:g('f-num')||'0000 0000 0000 0000',exp:g('f-exp')||'01/30',cvv:g('f-cvv')||'000',pin:'0000',bank:f.title,paysys:paysysOf(nd)||'Мир',holder:(g('f-holder')||'—').toUpperCase(),cardStyle:'black',src:'vault'}); }
    if(f.type==='doc'){ Object.assign(f,{num:g('f-num'),issued:g('f-issued'),date:'31.07.2026',docType:t('typeDoc'),attach:'',src:'vault'}); }
    if(f.type==='note'){ Object.assign(f,{body:g('f-body'),src:'vault'}); }
    f.upd = S.lang==='ru'?'31 июл 2026':'Jul 31, 2026';
    if(!f.id){ f.id=S.nextId++; f.fav=false; f.note=f.note||''; DB.unshift(f); }
    else { const i=DB.findIndex(x=>x.id===f.id); DB[i]=f; }
    const sec = f.type==='login'?'logins':f.type==='card'?'cards':f.type==='doc'?'docs':'notes';
    if(S.section!=='all' && !TOOL_IDS.includes(S.section)) S.section = sec;
    S.sel=f.id; S.form=null; renderEditor();
    toast(t('saved')+(f.src==='icloud'?' · '+t('savedCloud'):''));
    renderApp();
  },
  cancelForm(){ S.form=null; renderEditor(); },
  genLen(v){ S.gen.len=+v; $('#len-val').textContent=v; genPassword(); $('#gen-pass').innerHTML=colorize(S.gen.out);
    const bits=Math.round(S.gen.len*Math.log2(genPool().length||2)); document.querySelector('.entropy').textContent=`≈ ${bits} ${t('entropy')}`; },
  genOpt(k,v){ S.gen[k]=v; genPassword(); renderTool(); },
  regen(){ genPassword(); renderTool(); },
  copyGen(btn){ copyText(S.gen.out,'pass'); flashCopied(btn.querySelector?btn:null); },
  openFromSec(id){ const e=DB.find(x=>x.id===id); S.section = e.type==='login'?'logins':'all'; S.sel=id; renderApp(); },
  theme(v){ setTheme(v); },
  lang(v){ setLang(v); },
  helloSet(v){ S.obHello=v; toast('Windows Hello: '+(v?'✓':'—')); },
  toast(m){ toast(m); }
};
function renderListOnly(){
  const q=$('#q'); const pos=q?q.selectionStart:0;
  renderList();
  const q2=$('#q'); if(q2){ q2.focus(); q2.setSelectionRange(pos,pos); }
}

/* TOTP codes + ticker */
function rollCodes(){
  DB.filter(e=>e.totp).forEach(e=>{
    const a=new Uint32Array(1); crypto.getRandomValues(a);
    const n=String(a[0]%1000000).padStart(6,'0');
    S.codes[e.id]=n.slice(0,3)+' '+n.slice(3);
  });
}
rollCodes();
setInterval(()=>{
  S.totpLeft--;
  if(S.totpLeft<=0){
    S.totpLeft=30; rollCodes();
    document.querySelectorAll('[data-code-of]').forEach(el=>{ el.textContent = S.codes[+el.dataset.codeOf]||''; });
  }
  document.querySelectorAll('.tr-fg').forEach(r=>{ r.style.strokeDashoffset = 56.5*(1-S.totpLeft/30); });
},1000);

/* Ctrl+F focuses search; Esc closes editor/menu; click outside closes menu */
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='f'||e.key.toLowerCase()==='k')){ e.preventDefault(); const q=$('#q'); if(q) q.focus(); }
  if(e.key==='Escape'){
    const m=document.getElementById('plus-menu'); if(m){ m.remove(); return; }
    if(S.form){ S.form=null; renderEditor(); }
  }
});
document.addEventListener('click',e=>{
  if(!e.target.closest('#plus-menu') && !e.target.closest('.plus-btn')){
    const m=document.getElementById('plus-menu'); if(m) m.remove();
  }
});

renderAll();
</script>
