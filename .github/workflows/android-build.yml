name: android-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/IPasswrd.Mobile/**'
      - 'src/IPasswrd.Core/**'
      - '.github/workflows/android-build.yml'

defaults:
  run:
    working-directory: src/IPasswrd.Mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Diag (SDK должен быть 9.x — из-за global.json)
        run: |
          dotnet --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Раннер обычно уже несёт Android SDK, но нужной платформы/build-tools может не быть.
      - name: Ensure Android SDK bits
        run: >
          dotnet build IPasswrd.Mobile.csproj
          -f net9.0-android -t:InstallAndroidDependencies
          -p:IpwAndroidOnly=true -p:IpwNet9Only=true
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=True

      # Быстрая проверка компиляции: падает за пару минут, а не после полной упаковки.
      - name: Compile check (Debug)
        run: >
          dotnet build IPasswrd.Mobile.csproj
          -f net9.0-android -c Debug
          -p:IpwAndroidOnly=true -p:IpwNet9Only=true

      - name: Publish APK (Release, отладочная подпись)
        run: >
          dotnet publish IPasswrd.Mobile.csproj
          -f net9.0-android -c Release
          -p:IpwAndroidOnly=true -p:IpwNet9Only=true
          -p:AndroidKeyStore=false
          -p:AndroidPackageFormat=apk

      - name: Collect APK
        run: |
          mkdir -p out
          echo "--- найденные apk:"
          find bin/Release -name "*.apk" -print
          APK=$(find bin/Release -name "*-Signed.apk" | head -1)
          if [ -z "$APK" ]; then APK=$(find bin/Release -name "*.apk" | head -1); fi
          if [ -z "$APK" ]; then echo "::error::apk не собрался"; exit 1; fi
          cp "$APK" out/IPasswrd.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: IPasswrd-android-apk
          path: src/IPasswrd.Mobile/out/IPasswrd.apk
