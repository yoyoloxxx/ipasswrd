name: android-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/IPasswrd.Mobile/**'
      - 'core/IPasswrd.Core/**'
      - '.github/workflows/android-build.yml'

defaults:
  run:
    working-directory: mobile/IPasswrd.Mobile

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Постоянный ключ подписи. Без него каждая сборка подписывалась бы новым
      # одноразовым отладочным ключом, и обновление не встало бы поверх старого APK.
      IPW_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      IPW_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      IPW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Diag (SDK должен быть 9.x — из-за global.json)
        run: |
          dotnet --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Раннер обычно уже несёт Android SDK, но нужной платформы/build-tools может не быть.
      - name: Ensure Android SDK bits
        run: >
          dotnet build IPasswrd.Mobile.csproj
          -f net9.0-android -t:InstallAndroidDependencies
          -p:IpwAndroidOnly=true -p:IpwNet9Only=true
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=True

      # Быстрая проверка компиляции: падает за пару минут, а не после полной упаковки.
      - name: Compile check (Debug)
        run: >
          dotnet build IPasswrd.Mobile.csproj
          -f net9.0-android -c Debug
          -p:IpwAndroidOnly=true -p:IpwNet9Only=true

      - name: Restore signing keystore
        run: |
          if [ -n "$IPW_KEYSTORE_B64" ]; then
            printf '%s' "$IPW_KEYSTORE_B64" | base64 -d > ipasswrd.keystore
            echo "IPW_SIGNED=1" >> "$GITHUB_ENV"
            echo "ключ подписи получен из секретов"
          else
            echo "::warning::секрета ANDROID_KEYSTORE_B64 нет — APK будет подписан одноразовым отладочным ключом, и обновление НЕ встанет поверх предыдущего"
          fi

      - name: Publish APK (Release, постоянный ключ)
        if: env.IPW_SIGNED == '1'
        run: >
          dotnet publish IPasswrd.Mobile.csproj
          -f net9.0-android -c Release
          -p:IpwAndroidOnly=true -p:IpwNet9Only=true
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=ipasswrd.keystore
          -p:AndroidSigningKeyAlias="$IPW_KEY_ALIAS"
          -p:AndroidSigningKeyPass="$IPW_KEYSTORE_PASS"
          -p:AndroidSigningStorePass="$IPW_KEYSTORE_PASS"

      - name: Publish APK (Release, отладочная подпись — запасной путь)
        if: env.IPW_SIGNED != '1'
        run: >
          dotnet publish IPasswrd.Mobile.csproj
          -f net9.0-android -c Release
          -p:IpwAndroidOnly=true -p:IpwNet9Only=true
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false

      - name: Collect APK
        run: |
          mkdir -p out
          echo "--- найденные apk:"
          find bin/Release -name "*.apk" -print
          APK=$(find bin/Release -name "*-Signed.apk" | head -1)
          if [ -z "$APK" ]; then APK=$(find bin/Release -name "*.apk" | head -1); fi
          if [ -z "$APK" ]; then echo "::error::apk не собрался"; exit 1; fi
          cp "$APK" out/IPasswrd.apk
          ls -la out

      - name: Отпечаток подписи (чтобы видеть, что ключ тот же)
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs out/IPasswrd.apk | grep -i "SHA-1" || true
          fi

      - name: Убрать ключ с раннера
        if: always()
        run: rm -f ipasswrd.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: IPasswrd-android-apk
          path: mobile/IPasswrd.Mobile/out/IPasswrd.apk
