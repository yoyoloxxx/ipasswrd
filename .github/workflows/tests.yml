name: tests

# Страховка от «собралось, но сломано». Сегодняшние ошибки — пропавшая иконка,
# заглушка вместо заставки, отключившееся автозаполнение — доехали до живого
# телефона, потому что проверял их только человек. Пусть проверяет CI.
#
# M16: core tests run on net9 (mobile TFM) AND net10 (desktop TFM). Mobile app
# builds stay on SDK 9 (Hot Restart / MAUI — see mobile csproj); Windows stays on
# SDK 10. Dual-TFM tests are the practical SDK alignment — we do not force MAUI
# onto net10 while Hot Restart is broken there.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'windows/**'
      - 'mobile/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Тесты ядра (шифрование, unlock-pull, autolock, Autofill-policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both SDKs: net10.0 needs SDK 10; net9.0 is the mobile library TFM.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: dotnet test (net10.0 — desktop TFM)
        run: >
          dotnet test tests/IPasswrd.Core.Tests/IPasswrd.Core.Tests.csproj
          -c Release -f net10.0 --logger "console;verbosity=normal"
      - name: dotnet test (net9.0 — mobile TFM)
        run: >
          dotnet test tests/IPasswrd.Core.Tests/IPasswrd.Core.Tests.csproj
          -c Release -f net9.0 --logger "console;verbosity=normal"

  windows-app:
    name: Сборка приложения для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: dotnet build
        run: dotnet build windows/IPasswrd.App/IPasswrd.App.csproj -c Release
