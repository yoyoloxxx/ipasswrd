name: tests

# Страховка от «собралось, но сломано». Сегодняшние ошибки — пропавшая иконка,
# заглушка вместо заставки, отключившееся автозаполнение — доехали до живого
# телефона, потому что проверял их только человек. Пусть проверяет CI.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'windows/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Тесты ядра (шифрование, восстановление, синхронизация)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: dotnet test
        run: >
          dotnet test tests/IPasswrd.Core.Tests/IPasswrd.Core.Tests.csproj
          -c Release --logger "console;verbosity=normal"

  windows-app:
    name: Сборка приложения для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: dotnet build
        run: dotnet build windows/IPasswrd.App/IPasswrd.App.csproj -c Release