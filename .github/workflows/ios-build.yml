name: ios-build
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/IPasswrd.Mobile/**'
      - 'mobile/IPasswrd.AutoFill/**'
      - 'core/IPasswrd.Core/**'
      - '.github/workflows/ios-build.yml'

defaults:
  run:
    working-directory: mobile/IPasswrd.Mobile

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Diag (SDK must be 9.x thanks to global.json)
        run: |
          dotnet --version
          xcodebuild -version
      - name: Install MAUI iOS workload (iOS SDK 18.5.9219 = Xcode 16.4)
        run: |
          printf '{ "microsoft.net.sdk.ios": "18.5.9219/9.0.100" }' > wl-rollback.json
          dotnet workload install maui-ios --from-rollback-file wl-rollback.json
      - name: Build unsigned (Release, ios-arm64)
        run: >
          dotnet publish IPasswrd.Mobile.csproj
          -f net9.0-ios -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:IpwNet9Only=true
          -p:IpwIosOnly=true
      - name: Embed AutoFill appex (MAUI не встраивает ProjectReference-расширение сам)
        run: |
          APP=$(find bin/Release/net9.0-ios -name "*.app" -type d | head -1)
          echo "app bundle: $APP"
          if [ ! -d "$APP/PlugIns/IPasswrd.AutoFill.appex" ]; then
            SRC=$(find ../IPasswrd.AutoFill/bin -name "IPasswrd.AutoFill.appex" -type d | head -1)
            if [ -z "$SRC" ]; then
              echo "appex не найден в bin — собираю расширение отдельно"
              dotnet publish ../IPasswrd.AutoFill/IPasswrd.AutoFill.csproj -f net9.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false -p:IpwNet9Only=true
              SRC=$(find ../IPasswrd.AutoFill/bin -name "IPasswrd.AutoFill.appex" -type d | head -1)
            fi
            if [ -n "$SRC" ]; then
              mkdir -p "$APP/PlugIns"
              cp -R "$SRC" "$APP/PlugIns/"
              echo "appex скопирован из $SRC"
            else
              echo "::error::IPasswrd.AutoFill.appex так и не собрался"
              exit 1
            fi
          fi
          ls "$APP/PlugIns/IPasswrd.AutoFill.appex" | head -20
      - name: Ad-hoc sign with entitlements (AltStore читает их при переподписи)
        run: |
          APP=$(find bin/Release/net9.0-ios -name "*.app" -type d | head -1)
          sign_nested() {
            if [ -d "$1/Frameworks" ]; then
              find "$1/Frameworks" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 |
              while IFS= read -r -d '' f; do /usr/bin/codesign --force -s - "$f"; done
            fi
          }
          APPEX="$APP/PlugIns/IPasswrd.AutoFill.appex"
          sign_nested "$APPEX"
          /usr/bin/codesign --force -s - --entitlements ../IPasswrd.AutoFill/Entitlements.plist "$APPEX"
          echo "appex signed"
          sign_nested "$APP"
          /usr/bin/codesign --force -s - --entitlements Entitlements.plist "$APP"
          /usr/bin/codesign -d --entitlements :- "$APP" | head -30
      - name: Pack IPA
        run: |
          APP=$(find bin/Release/net9.0-ios -name "*.app" -type d | head -1)
          echo "app bundle: $APP"
          mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry out/IPasswrd-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPasswrd-unsigned-ipa
          path: mobile/IPasswrd.Mobile/out/IPasswrd-unsigned.ipa

      # Публикация для AltStore/SideStore: IPA уходит в GitHub Release mobile-v<версия>,
      # а docs/altstore.json пересобирается из шаблона с точными размером/датой/ссылкой
      # и пушится в main (Pages отдаёт его как источник). AltStore предложит обновление,
      # когда в csproj поднимут ApplicationDisplayVersion/ApplicationVersion.
      - name: Publish IPA + altstore.json
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -o '<ApplicationDisplayVersion>[^<]*' IPasswrd.Mobile.csproj | cut -d'>' -f2)
          BUILD=$(grep -o '<ApplicationVersion>[^<]*' IPasswrd.Mobile.csproj | cut -d'>' -f2)
          SIZE=$(stat -f%z out/IPasswrd-unsigned.ipa)
          DATE=$(date -u +%Y-%m-%d)
          # Скользящий ПРЕРЕЛИЗНЫЙ тег: ссылки вечные, а «latest» остаётся за Windows-релизом —
          # иначе кнопка скачивания на сайте (releases/latest/download/...) начала бы отдавать 404.
          TAG="mobile-latest"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/IPasswrd-unsigned.ipa"
          gh release create "$TAG" --prerelease --repo "$GITHUB_REPOSITORY" --title "IPasswrd mobile (текущая сборка)" --notes "Мобильная сборка: IPA — для AltStore/SideStore (источник https://yoyoloxxx.github.io/ipasswrd/altstore.json), APK — для Android. Версия — в altstore.json." || true
          gh release upload "$TAG" out/IPasswrd-unsigned.ipa --repo "$GITHUB_REPOSITORY" --clobber
          jq --arg v "$VER" --arg b "$BUILD" --arg d "$DATE" --argjson s "$SIZE" --arg u "$URL" \
            '.apps[0].versions[0] |= (.version=$v | .buildVersion=$b | .date=$d | .size=$s | .downloadURL=$u)' \
            ../../docs/altstore.template.json > ../../docs/altstore.json
          cd ../..
          if ! git diff --quiet -- docs/altstore.json 2>/dev/null || [ -n "$(git status --porcelain docs/altstore.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/altstore.json
            git commit -m "ci: altstore.json -> $VER (build $BUILD)"
            git pull --rebase origin main
            git push origin main
          fi
