name: ios-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/IPasswrd.Mobile/**'
      - 'src/IPasswrd.Core/**'
      - '.github/workflows/ios-build.yml'

defaults:
  run:
    working-directory: src/IPasswrd.Mobile

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Diag (SDK must be 9.x thanks to global.json)
        run: |
          dotnet --version
          xcodebuild -version
      - name: Install MAUI iOS workload (iOS SDK 18.5.9219 = Xcode 16.4)
        run: |
          printf '{ "microsoft.net.sdk.ios": "18.5.9219/9.0.100" }' > wl-rollback.json
          dotnet workload install maui-ios --from-rollback-file wl-rollback.json
      - name: Build unsigned (Release, ios-arm64)
        run: >
          dotnet publish IPasswrd.Mobile.csproj
          -f net9.0-ios -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:TargetFrameworks=net9.0
      - name: Pack IPA
        run: |
          APP=$(find bin/Release/net9.0-ios -name "*.app" -type d | head -1)
          echo "app bundle: $APP"
          mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry out/IPasswrd-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPasswrd-unsigned-ipa
          path: src/IPasswrd.Mobile/out/IPasswrd-unsigned.ipa