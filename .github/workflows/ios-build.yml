name: ios-build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/IPasswrd.Mobile/**'
      - 'src/IPasswrd.Core/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Select Xcode 26.5 and graft stripped platforms
        run: |
          X="$(ls -d /Applications/Xcode_26.5*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$X" ]; then X="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"; fi
          FULL="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selected: $X (donor for stripped parts: $FULL)"
          for P in MacOSX iPhoneOS iPhoneSimulator; do
            SDKS="$X/Contents/Developer/Platforms/$P.platform/Developer/SDKs"
            if [ ! -e "$SDKS/$P.sdk" ]; then
              REAL="$(readlink -f "$FULL/Contents/Developer/Platforms/$P.platform/Developer/SDKs/$P.sdk" || true)"
              if [ -n "$REAL" ] && [ -d "$REAL" ]; then
                echo "Linking $P.sdk -> $REAL (real dir from donor)"
                sudo mkdir -p "$SDKS"
                sudo ln -sfn "$REAL" "$SDKS/$P.sdk"
              else
                echo "Donor has no $P.sdk either; grafting whole platform"
                sudo rm -rf "$X/Contents/Developer/Platforms/$P.platform"
                sudo ln -sfn "$FULL/Contents/Developer/Platforms/$P.platform" "$X/Contents/Developer/Platforms/$P.platform"
              fi
            fi
          done
          echo "Verify:"; ls -laL "$X/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" | head -3
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios
      - name: Build unsigned (Release, ios-arm64)
        run: >
          dotnet publish src/IPasswrd.Mobile/IPasswrd.Mobile.csproj
          -f net9.0-ios -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
      - name: Pack IPA
        run: |
          APP=$(find src/IPasswrd.Mobile/bin/Release/net9.0-ios -name "*.app" -type d | head -1)
          echo "app bundle: $APP"
          mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry out/IPasswrd-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPasswrd-unsigned-ipa
          path: out/IPasswrd-unsigned.ipa